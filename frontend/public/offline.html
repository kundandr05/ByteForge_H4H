<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | DispatchGrid Field Ops</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b132b;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .card {
      background-color: #1c2541;
      border: 1px solid #3a506b;
      border-radius: 1rem;
      padding: 2.5rem;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      font-size: 0.8125rem;
      font-weight: 600;
      border-radius: 9999px;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 0.75rem 0;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      background-color: #2563eb;
      color: #ffffff;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 0.5rem;
      text-decoration: none;
      transition: background-color 0.2s;
      cursor: pointer;
      border: none;
    }
    .btn:hover {
      background-color: #1d4ed8;
    }
    .note {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Offline Mode</div>
    <h1>Field Signal Disconnected</h1>
    <p>DispatchGrid is operating in offline-first mode. Previously synchronized schedules and work orders remain accessible in your local application cache.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    <div class="note">Local changes made offline will automatically synchronize when connectivity is restored.</div>
  </div>
</body>
</html>
