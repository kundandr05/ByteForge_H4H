services:
  - type: web
    name: dispatchgrid
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run render:build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        value: "file:./dev.db"

